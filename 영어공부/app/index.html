<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 아이폰 '홈 화면에 추가' 시 앱처럼(전체 화면·아이콘) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="영어공부">
<link rel="apple-touch-icon" href="icon.png">
<title>영어공부 — 비즈니스 영어 듣기 훈련</title>
<style>
  :root {
    --bg: #f6f7fb; --card: #ffffff; --ink: #1f2430; --sub: #6b7280;
    --accent: #3b5bdb; --accent-soft: #e7ecff; --ok: #16a34a; --bad: #dc2626;
    --warn: #d97706; --line: #e5e7eb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Segoe UI', 'Malgun Gothic', sans-serif; background: var(--bg); color: var(--ink); font-size: 18px; display: flex; flex-direction: column; min-height: 100vh; }
  main { flex: 1; display: flex; width: 100%; padding: 0 16px 40px; }
  main > section { margin: 0 auto; width: 100%; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px; margin-bottom: 16px; }
  .card h2 { font-size: 26px; }
  .muted { color: var(--sub); font-size: 16px; }
  input[type=text] { padding: 13px; border-radius: 10px; border: 1px solid var(--line); font-size: 18px; width: 100%; }
  .hidden { display: none; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.show { opacity: 1; }
  /* 영상 + 정지·속도: 상단 고정 (--bar-h = 이 바의 높이, JS가 갱신 → 아래 목록 높이 계산용) */
  .player-bar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0 10px; }
  .vid-wrap { position: relative; width: min(100%, 71vh); aspect-ratio: 16 / 9; margin: 0 auto; border-radius: 14px; overflow: hidden; background: #000; }
  .vid-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .player-ctrl { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
  .player-ctrl .ko-toggle { margin: 0; font-size: 17px; padding: 8px 20px; }
  .player-ctrl label.ko-toggle { display: flex; align-items: center; gap: 6px; }
  @media (max-width: 600px) { .player-ctrl { gap: 6px; } .player-ctrl .ko-toggle { font-size: 15px; padding: 6px 10px; } }
  .script-list { position: relative; max-height: calc(100vh - var(--bar-h, 0px) - 24px); overflow-y: auto; border: 1px solid var(--line); border-radius: 12px; margin-top: 12px; }
  .sl-item.turn { border-top: 2px solid #d1d5db; }
  .script-line { display: flex; gap: 12px; padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--line); align-items: baseline; }
  .sl-item:last-child .script-line { border-bottom: none; }
  .script-line:hover { background: var(--accent-soft); }
  .script-line.active { background: #fff7ed; box-shadow: inset 4px 0 0 var(--warn); }
  .script-line .ts { flex: none; font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 700; font-size: 15px; min-width: 50px; }
  .script-line .tx { font-size: 17px; line-height: 1.5; flex: 1; }
  .ko-toggle { flex: none; align-self: flex-start; margin-top: 1px; border: 1px solid var(--line); background: var(--card); color: var(--sub); border-radius: 8px; padding: 3px 10px; font-size: 14px; cursor: pointer; }
  .ko-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .ko-toggle.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .ko-panel { padding: 10px 16px 14px 62px; background: #eef6ff; border-bottom: 1px solid var(--line); }
  .ko-panel .ko-tr { color: var(--ink); font-weight: 600; font-size: 17px; margin-bottom: 6px; }
  .ko-panel .ko-terms { color: var(--sub); font-size: 15px; line-height: 1.75; border-top: 1px dashed #c7d2fe; padding-top: 6px; }
  .ko-panel .ko-terms b { color: var(--accent); }
  /* 오른쪽 '내 문장' 패널 (좁은 화면에선 스크립트 아래로) */
  #view-video { max-width: 1320px; }
  .video-grid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
  .picks-card { position: sticky; top: var(--bar-h, 0px); max-height: calc(100vh - var(--bar-h, 0px) - 16px); display: flex; flex-direction: column; padding: 20px; }
  .picks-list { overflow-y: auto; min-height: 0; }
  .picks-list .script-line { padding: 9px 6px; gap: 8px; }
  .picks-list .script-line .ts { min-width: 40px; }
  .picks-list .script-line .tx { font-size: 16px; }
  .picks-list .ko-panel { padding-left: 54px; }
  .picks-group { font-weight: 700; font-size: 14px; color: var(--sub); margin: 14px 0 4px; }
  .ko-toggle.pick-btn.on { background: #fff7ed; color: var(--warn); border-color: var(--warn); }
  @media (max-width: 1100px) { .video-grid { grid-template-columns: 1fr; } .picks-card { position: static; max-height: none; } .picks-list { max-height: calc(100vh - var(--bar-h, 0px) - 24px); } }
</style>
</head>
<body>
<main>
<!-- ───────── 영상 스크립트 ───────── -->
<section id="view-video">
 <!-- 영상 + 정지·속도: 스크롤해도 항상 상단에 고정 -->
 <div class="player-bar" id="player-bar">
  <div class="vid-wrap"><div id="yt-player"></div></div>
  <div class="player-ctrl">
    <button class="ko-toggle" title="이전 문장" onclick="stepLine(-1)">⏮</button>
    <button class="ko-toggle" id="play-btn" onclick="togglePlay()">▶ 재생</button>
    <button class="ko-toggle" title="다음 문장" onclick="stepLine(1)">⏭</button>
    <button class="ko-toggle rate-btn on" data-rate="1" onclick="setRate(1)">1x</button>
    <button class="ko-toggle rate-btn" data-rate="0.5" onclick="setRate(0.5)">0.5x</button>
    <button class="ko-toggle pick-btn" id="bar-pick" title="지금 나오는 문장을 내 문장에 담기" onclick="pickCurrent()">☆ 담기</button>
    <label class="ko-toggle"><input type="checkbox" id="video-follow" checked> 따라가기</label>
    <label class="ko-toggle" title="문장이 끝날 때마다 멈춤 — 따라 말한 뒤 ▶ 재생"><input type="checkbox" id="shadow"> 쉐도잉</label>
  </div>
 </div>
 <div class="video-grid">
  <div class="card">
    <div id="video-empty" class="muted hidden">영상 스크립트가 아직 없어요.</div>
    <div id="video-main">
      <h2 id="video-title" style="margin-top:0">🎬 영상 스크립트</h2>
      <select id="video-select" class="hidden" onchange="pickVideo(+this.value)" style="width:100%;margin-bottom:12px;padding:11px;border-radius:10px;border:1px solid var(--line);font-size:17px"></select>
      <p class="muted" id="video-hint" style="margin:10px 0 0">문장을 누르면 <b>그 지점부터 영상이 재생</b>돼요. 오른쪽 <b>「한」</b> 버튼을 누르면 그 문장만 <b>한글 뜻·핵심 표현</b>이 펼쳐지고, <b>☆</b>를 누르면 <b>⭐ 내 문장</b>에 담겨 계속 복습할 수 있어요. 재생 중엔 지금 나오는 문장이 자동으로 표시돼요.</p>
      <input type="text" id="video-search" placeholder="🔎 영어 문장 검색..." oninput="filterScript()" style="margin-top:12px">

      <div class="muted" id="video-count" style="margin-top:8px"></div>
      <div class="script-list" id="script-list"></div>
    </div>
  </div>
  <div class="card picks-card" id="picks-card">
    <h3 style="margin:0 0 4px">⭐ 내 문장 <span id="picks-count" class="muted" style="font-weight:400"></span></h3>
    <p class="muted" style="margin:0 0 6px;font-size:14px">스크립트의 ☆로 담고, 누르면 <b>그 문장만 반복 재생</b>돼요. 다시 누르면 멈춰요.</p>
    <div class="picks-list" id="picks-list"></div>
  </div>
 </div>
</section>

</main>
<div class="toast" id="toast"></div>

<script>
// 로컬(PC 서버) vs 온라인(Netlify 등 정적 호스팅) 모드 자동 감지
const LOCAL = ['localhost', '127.0.0.1'].includes(location.hostname);
const LS_KEYS = { 'data/video_picks.json': 'engstudy.picks' };
let DB = {};

const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const $ = id => document.getElementById(id);
const toast = msg => { const t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); };

async function load() {
  DB.videoScripts = await fetch('/data/video_scripts.json').then(r => r.json()).catch(() => ({ videos: [] }));
  DB.picks = (!LOCAL && lsGet(LS_KEYS['data/video_picks.json'])) || await fetch('/data/video_picks.json').then(r => r.json()).catch(() => ({ picks: [] }));
  // 첫 동기화 1회: 이 기기에 있던 담은 문장을 공유 목록에 합침
  if (!localStorage.getItem(PICKS_MIGRATED)) syncPicks(DB.picks.picks.map(p => ({ v: p.v, i: p.i, on: true }))).then(ok => ok && localStorage.setItem(PICKS_MIGRATED, '1'));
  else syncPicks();
  ensureVideo();
}

async function save(file, content) {
  if (!LOCAL) { localStorage.setItem(LS_KEYS[file], JSON.stringify(content)); return; }
  const r = await fetch('/api/save', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ file, content }) });
  if (!r.ok) { toast('저장 실패! 서버 확인 필요'); throw new Error('save failed'); }
}

/* ───── 영상 스크립트 ───── */
let ytPlayer = null, ytReady = false, videoData = null, videoLines = [], videoActiveIdx = -1, videoPoll = null, videoBuilt = false;
let pickLoop = null; // ⭐ 내 문장 반복 구간 {v, i, start, end} — 그 문장만 반복 재생
const fmtTs = sec => Math.floor(sec / 60) + ':' + String(Math.floor(sec % 60)).padStart(2, '0');

function ensureVideo() {
  if (videoBuilt) return;
  const vids = (DB.videoScripts && DB.videoScripts.videos) || [];
  if (!vids.length) { $('video-main').classList.add('hidden'); $('picks-card').classList.add('hidden'); $('video-empty').classList.remove('hidden'); videoBuilt = true; return; }
  const sel = $('video-select');
  sel.innerHTML = vids.map((v, i) => `<option value="${i}">${escapeHtml(v.title || v.videoId)} (${v.lines.length}문장)</option>`).join('');
  sel.classList.toggle('hidden', vids.length < 2);
  pickVideo(0);
  renderPicks();
  loadYT();
  videoBuilt = true;
}

function pickVideo(i, startAt) {
  videoData = DB.videoScripts.videos[i];
  if (pickLoop) { pickLoop = null; renderPicks(); }
  $('video-title').textContent = '🎬 ' + (videoData.title || '영상 스크립트');
  videoLines = videoData.lines || [];
  videoActiveIdx = -1;
  $('video-search').value = '';
  renderScript('');
  updateBarPick();
  $('script-list').scrollTop = 0;
  if (!ytReady) return;
  if (startAt != null) ytPlayer.loadVideoById(videoData.videoId, startAt); // 바로 그 지점부터 재생 (cue 뒤에 load하면 무시됨)
  else ytPlayer.cueVideoById(videoData.videoId);
}

function renderScript(q) {
  q = (q || '').trim().toLowerCase();
  const list = $('script-list');
  let shown = 0;
  const vid = videoData.videoId;
  const picked = new Set(DB.picks.picks.filter(p => p.v === vid).map(p => p.i));
  list.innerHTML = videoLines.map((L, i) => {
    if (q && !L.en.toLowerCase().includes(q)) return '';
    shown++;
    const on = picked.has(i);
    return `<div class="sl-item${L.turn ? ' turn' : ''}">`
      + `<div class="script-line${i === videoActiveIdx ? ' active' : ''}" data-idx="${i}" onclick="seekTo(${i})">`
      + `<span class="ts">${fmtTs(L.t)}</span><span class="tx">${escapeHtml(L.en)}</span>`
      + `<button class="ko-toggle pick-btn${on ? ' on' : ''}" title="내 문장에 담기" onclick="event.stopPropagation();togglePick('${vid}',${i})">${on ? '★' : '☆'}</button>`
      + `<button class="ko-toggle" title="한글 뜻·표현 보기" onclick="event.stopPropagation();toggleKo(videoLines[${i}],this)">한</button>`
      + `</div><div class="ko-panel hidden"></div></div>`;
  }).join('');
  $('video-count').textContent = q ? `“${q}” 검색 결과 ${shown}개 / 전체 ${videoLines.length}문장` : `전체 ${videoLines.length}문장`;
}
function escapeHtml(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function filterScript() { renderScript($('video-search').value); }

function toggleKo(L, btn) {
  const panel = btn.closest('.sl-item').querySelector('.ko-panel');
  const willShow = panel.classList.contains('hidden');
  if (willShow && !panel.dataset.filled) {
    if (!L.ko) {
      panel.innerHTML = '<span class="muted">아직 한글 뜻이 준비되지 않았어요. (생성 중 — 잠시 후 새로고침)</span>';
    } else {
      let h = `<div class="ko-tr">🇰🇷 ${escapeHtml(L.ko)}</div>`;
      if (L.terms && L.terms.length) {
        h += '<div class="ko-terms">' + L.terms.map(t => `<div><b>${escapeHtml(t.term)}</b> — ${escapeHtml(t.ko)}</div>`).join('') + '</div>';
      }
      panel.innerHTML = h;
      panel.dataset.filled = '1';   // 뜻이 있을 때만 캐시 (생성 전이면 다음에 다시 시도)
    }
  }
  panel.classList.toggle('hidden');
  btn.classList.toggle('on', !panel.classList.contains('hidden'));
}

function seekTo(i) {
  if (pickLoop) { pickLoop = null; renderPicks(); }
  const t = videoLines[i].t;
  if (ytReady && ytPlayer && ytPlayer.seekTo) { ytPlayer.seekTo(t, true); ytPlayer.playVideo(); setActive(i); } // 바로 표시 — ⏭ 연타해도 다음 줄로
  else { window.open(`https://www.youtube.com/watch?v=${videoData.videoId}&t=${Math.floor(t)}s`, '_blank'); }
}
// 이전/다음 문장 — 같은 시각 줄은 한 문장으로 보고 건너뜀
function nextLine(i) { for (let j = i + 1; j < videoLines.length; j++) if (videoLines[j].t > videoLines[i].t) return j; return -1; }
function prevLine(i) { for (let j = i - 1; j >= 0; j--) if (videoLines[j].t < videoLines[i].t) return j; return 0; }
function stepLine(d) {
  const i = videoActiveIdx < 0 ? 0 : d > 0 ? nextLine(videoActiveIdx) : prevLine(videoActiveIdx);
  if (i >= 0) seekTo(i);
}

/* ───── ⭐ 내 문장 (영상에서 고른 문장 모아 복습) ─────
   picks: [{v: videoId, i: 줄 번호}] — 타임스탬프는 영상 안에서 중복될 수 있어 줄 번호로 식별.
   ponytail: 줄 번호 기준이라 이미 담은 영상의 스크립트를 다시 만들면(재분할) 엉뚱한 줄을 가리킴 — 그땐 en으로 재매핑 필요 */
let pickRows = [];
/* PC·폰 공유: Netlify 함수(netlify/functions/picks.mjs)가 원본 목록, 각 기기 파일/localStorage는 오프라인용 사본.
   담기/빼기는 연산({v,i,on})으로 보내 양쪽 변경이 누적됨. 못 보낸 연산은 PICKS_PENDING에 쌓았다가 다음 동기화 때 재전송 */
const PICKS_API = (LOCAL ? 'https://tubular-pavlova-e88756.netlify.app' : '') + '/api/picks';
const PICKS_PENDING = 'engstudy.picks.pending', PICKS_MIGRATED = 'engstudy.picks.migrated';
async function syncPicks(ops = []) {
  const pending = [...(lsGet(PICKS_PENDING) || []), ...ops];
  try {
    const r = await fetch(PICKS_API, pending.length ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ops: pending }) } : { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const { picks } = await r.json();
    localStorage.removeItem(PICKS_PENDING);
    if (JSON.stringify(picks) !== JSON.stringify(DB.picks.picks)) {
      DB.picks = { picks };
      save('data/video_picks.json', DB.picks);
      if (videoBuilt && videoData) { renderScript($('video-search').value); renderPicks(); }
    }
    return true;
  } catch (e) {
    localStorage.setItem(PICKS_PENDING, JSON.stringify(pending));
    return false;
  }
}
// 다른 기기에서 바꾼 걸 앱으로 돌아올 때 반영
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && DB.picks) syncPicks(); });
function togglePick(v, i) {
  const P = DB.picks;
  const at = P.picks.findIndex(p => p.v === v && p.i === i);
  if (at >= 0) P.picks.splice(at, 1); else P.picks.push({ v, i });
  save('data/video_picks.json', P);
  syncPicks([{ v, i, on: at < 0 }]);
  renderPicks();
  const b = v === videoData.videoId && $('script-list').querySelector(`[data-idx="${i}"] .pick-btn`);
  if (b) { b.classList.toggle('on', at < 0); b.textContent = at < 0 ? '★' : '☆'; }
}
function renderPicks() {
  const vids = DB.videoScripts.videos;
  pickRows = DB.picks.picks
    .map(p => { const vi = vids.findIndex(x => x.videoId === p.v); return { p, vi, L: vi >= 0 && vids[vi].lines[p.i] }; })
    .filter(r => r.L)
    .sort((a, b) => a.vi - b.vi || a.p.i - b.p.i);
  $('picks-count').textContent = pickRows.length ? `(${pickRows.length})` : '';
  let h = '', lastVi = -1;
  pickRows.forEach((r, k) => {
    if (r.vi !== lastVi) { h += `<div class="picks-group">🎬 ${escapeHtml(vids[r.vi].title || r.p.v)}</div>`; lastVi = r.vi; }
    const looping = pickLoop && pickLoop.v === r.p.v && pickLoop.i === r.p.i;
    h += `<div class="sl-item"><div class="script-line${looping ? ' active' : ''}" onclick="playPick(${k})">`
      + `<span class="ts">${looping ? '🔁 ' : ''}${fmtTs(r.L.t)}</span><span class="tx">${escapeHtml(r.L.en)}</span>`
      + `<button class="ko-toggle" title="한글 뜻·표현 보기" onclick="event.stopPropagation();toggleKo(pickRows[${k}].L,this)">한</button>`
      + `<button class="ko-toggle" title="빼기" onclick="event.stopPropagation();togglePick('${r.p.v}',${r.p.i})">✕</button>`
      + `</div><div class="ko-panel hidden"></div></div>`;
  });
  $('picks-list').innerHTML = h || '<p class="muted" style="font-size:15px">아직 담은 문장이 없어요.</p>';
  updateBarPick();
}
// 상단 바 ☆ = 지금 재생 중인 문장 담기/빼기
function pickCurrent() {
  if (videoActiveIdx < 0) { toast('영상을 재생하면 지금 나오는 문장을 담을 수 있어요'); return; }
  togglePick(videoData.videoId, videoActiveIdx);
}
function updateBarPick() {
  const on = DB.picks.picks.some(p => p.v === videoData.videoId && p.i === videoActiveIdx);
  $('bar-pick').classList.toggle('on', on);
  $('bar-pick').textContent = on ? '★ 담음' : '☆ 담기';
}
// 누르면 그 문장만 반복(다음 문장 시작 시각까지), 다시 누르면 반복 끄고 일시정지
function playPick(k) {
  const r = pickRows[k], P = r.p;
  if (pickLoop && pickLoop.v === P.v && pickLoop.i === P.i) { pickLoop = null; renderPicks(); if (ytReady) ytPlayer.pauseVideo(); return; }
  const other = DB.videoScripts.videos[r.vi] !== videoData;
  if (other) { $('video-select').value = r.vi; pickVideo(r.vi, r.L.t); }
  if (!other || !ytReady) seekTo(P.i);
  if (!ytReady) return;
  const n = nextLine(P.i);
  pickLoop = { v: P.v, i: P.i, start: r.L.t, end: n >= 0 ? videoLines[n].t : Infinity };
  renderPicks();
}

function loadYT() {
  if (window.YT && window.YT.Player) { createPlayer(); return; }
  if (!document.getElementById('yt-api-script')) {
    const tag = document.createElement('script');
    tag.id = 'yt-api-script'; tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
  }
  window.onYouTubeIframeAPIReady = createPlayer;
}
function createPlayer() {
  if (ytPlayer) return;
  ytPlayer = new YT.Player('yt-player', {
    videoId: videoData.videoId,
    playerVars: { playsinline: 1, rel: 0, modestbranding: 1 },
    events: { onReady: () => { ytReady = true; if (ytPlayer.getVideoData().video_id !== videoData.videoId) ytPlayer.cueVideoById(videoData.videoId); }, onStateChange: onYtState },
  });
}
// 재생 속도 — 영상을 바꾸면(loadVideoById) 1x로 돌아가므로 재생 시작 때마다 다시 맞춤
let playRate = 1;
function setRate(r) {
  playRate = r;
  document.querySelectorAll('.rate-btn').forEach(b => b.classList.toggle('on', +b.dataset.rate === r));
  if (ytReady) ytPlayer.setPlaybackRate(r);
}
function togglePlay() {
  if (!ytReady) return;
  if (ytPlayer.getPlayerState() === YT.PlayerState.PLAYING) ytPlayer.pauseVideo(); else ytPlayer.playVideo();
}
function onYtState(e) {
  $('play-btn').textContent = e.data === YT.PlayerState.PLAYING ? '⏸ 정지' : '▶ 재생'; // 영상 직접 조작해도 맞춰짐
  if (e.data === YT.PlayerState.PLAYING && ytPlayer.getPlaybackRate() !== playRate) ytPlayer.setPlaybackRate(playRate);
  if (e.data === YT.PlayerState.PLAYING) startVideoPoll(); else stopVideoPoll();
  if (e.data === YT.PlayerState.ENDED && pickLoop) { ytPlayer.seekTo(pickLoop.start, true); ytPlayer.playVideo(); } // 마지막 문장 반복
}
let shadowLastT = 0;
function startVideoPoll() { if (!videoPoll) videoPoll = setInterval(updateActiveLine, 200); }
function stopVideoPoll() { if (videoPoll) { clearInterval(videoPoll); videoPoll = null; } }
function updateActiveLine() {
  if (!ytReady || !ytPlayer.getCurrentTime) return;
  const t = ytPlayer.getCurrentTime();
  if (pickLoop && t >= pickLoop.end) { ytPlayer.seekTo(pickLoop.start, true); return; } // ⭐ 내 문장 반복
  // 쉐도잉: 재생이 흘러서(점프 아님) 다음 문장 시작을 넘으면 멈추고 그 문장 시작으로 맞춤
  if ($('shadow').checked && !pickLoop && videoActiveIdx >= 0) {
    const n = nextLine(videoActiveIdx), end = n >= 0 && videoLines[n].t;
    if (n >= 0 && shadowLastT < end && t >= end && t - shadowLastT < 1) { ytPlayer.pauseVideo(); ytPlayer.seekTo(end, true); }
  }
  shadowLastT = t;
  let lo = 0, hi = videoLines.length - 1, idx = 0;
  while (lo <= hi) { const mid = (lo + hi) >> 1; if (videoLines[mid].t <= t) { idx = mid; lo = mid + 1; } else hi = mid - 1; }
  setActive(idx);
}
function setActive(idx) {
  if (idx === videoActiveIdx) return;
  const prev = $('script-list').querySelector('.script-line.active');
  if (prev) prev.classList.remove('active');
  videoActiveIdx = idx;
  updateBarPick();
  const el = $('script-list').querySelector(`[data-idx="${idx}"]`);
  if (el) {
    el.classList.add('active');
    if ($('video-follow').checked) {
      const box = $('script-list');
      box.scrollTop = el.offsetTop;
    }
  }
}

// 상단 고정 바 높이 → CSS --bar-h (스크립트·내 문장 목록이 바 아래 화면에 딱 맞게)
new ResizeObserver(([e]) => document.documentElement.style.setProperty('--bar-h', e.target.offsetHeight + 'px')).observe($('player-bar'));
load();
</script>
</body>
