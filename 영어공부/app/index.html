<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 아이폰 '홈 화면에 추가' 시 앱처럼(전체 화면·아이콘) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="영어공부">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>영어공부 — 비즈니스 영어 듣기 훈련</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115; --card: #171a21; --ink: #e6e8ee; --sub: #9aa3b2;
    --accent: #7c9cff; --accent-soft: #1e2638; --ok: #22c55e; --bad: #f87171;
    --warn: #f59e0b; --line: #2a2f3a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Segoe UI', 'Malgun Gothic', sans-serif; background: var(--bg); color: var(--ink); font-size: 18px; display: flex; flex-direction: column; min-height: 100vh; }
  main { flex: 1; display: flex; width: 100%; padding: 0 16px calc(var(--nav-h, 0px) + 16px); }
  main > section { margin: 0 auto; width: 100%; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px; margin-bottom: 16px; }
  .card h2 { font-size: 26px; }
  .muted { color: var(--sub); font-size: 16px; }
  input[type=text] { padding: 13px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 18px; width: 100%; }
  .hidden { display: none; }
  .toast { position: fixed; bottom: calc(var(--nav-h, 0px) + 14px); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 20px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.show { opacity: 1; }
  /* 영상: 상단 고정 (--bar-h = 이 바의 높이, JS가 갱신 → 아래 목록 높이 계산용) */
  .player-bar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0 10px; }
  .vid-wrap { position: relative; width: min(100%, 71vh); aspect-ratio: 16 / 9; margin: 0 auto; border-radius: 14px; overflow: hidden; background: #000; }
  .vid-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  /* 재생 컨트롤: 하단 고정 (--nav-h = 이 바의 높이). 버튼 폭을 고정해 라벨이 바뀌어도 배치가 안 움직임 */
  .ctrl-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--card); border-top: 1px solid var(--line); box-shadow: 0 -4px 14px rgba(0,0,0,.06); padding: 8px 8px max(8px, env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 18px; }
  .ctrl-bar .grp { display: flex; gap: 6px; }
  .ctrl-bar .ko-toggle { margin: 0; height: 46px; font-size: 18px; padding: 0; display: flex; align-items: center; justify-content: center; }
  .ctrl-bar .nav-btn { width: 52px; }
  .ctrl-bar #play-btn { width: 64px; font-size: 20px; }
  .ctrl-bar .rate-btn { width: 50px; font-size: 16px; }
  .ctrl-bar label.ko-toggle { width: 104px; gap: 5px; font-size: 15px; }
  @media (max-width: 600px) { .ctrl-bar { gap: 10px; } .ctrl-bar .grp { gap: 4px; } .ctrl-bar .nav-btn { width: 44px; } .ctrl-bar #play-btn { width: 54px; } .ctrl-bar .rate-btn { width: 42px; font-size: 14px; } .ctrl-bar label.ko-toggle { width: 90px; font-size: 14px; } }
  .script-list { position: relative; max-height: calc(100vh - var(--bar-h, 0px) - var(--nav-h, 0px) - 24px); overflow-y: auto; border: 1px solid var(--line); border-radius: 12px; margin-top: 12px; }
  .sl-item.turn { border-top: 2px solid #3a4150; }
  /* 문장 줄: 위 = 시각·버튼(작게), 아래 = 영어 문장(전체 폭) */
  .script-line { padding: 8px 14px 12px; cursor: pointer; border-bottom: 1px solid var(--line); }
  .sl-item:last-child .script-line { border-bottom: none; }
  .script-line:hover { background: var(--accent-soft); }
  .script-line.active { background: #2a2114; box-shadow: inset 4px 0 0 var(--warn); }
  .sl-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
  .sl-meta .ts { flex: 1; font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 700; font-size: 14px; }
  .sl-meta .ko-toggle { width: 38px; height: 28px; padding: 0; }
  .script-line .tx { font-size: 18px; line-height: 1.55; }
  .ko-toggle { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--sub); border-radius: 8px; padding: 3px 10px; font-size: 14px; cursor: pointer; }
  .ko-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .ko-toggle.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .ko-panel { padding: 10px 14px 14px; background: #141c2b; border-bottom: 1px solid var(--line); }
  .ko-panel .ko-tr { color: var(--ink); font-weight: 600; font-size: 17px; margin-bottom: 6px; }
  .ko-panel .ko-terms { color: var(--sub); font-size: 15px; line-height: 1.75; border-top: 1px dashed #334155; padding-top: 6px; }
  .ko-panel .ko-note { color: var(--ink); font-size: 15px; line-height: 1.7; margin-bottom: 8px; opacity: .9; }
  .ko-panel .ko-terms b { color: var(--accent); }
  #view-video { max-width: 960px; min-width: 0; }
  .ko-toggle.pick-btn.on { background: #2a2114; color: var(--warn); border-color: var(--warn); }
  .star-filter { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 16px; cursor: pointer; width: fit-content; }
  @media (max-width: 600px) { main { padding-left: 8px; padding-right: 8px; } .card { padding: 16px 12px; } .card h2 { font-size: 22px; } .script-line { padding: 8px 10px 12px; } .script-line .tx { font-size: 17px; } }
</style>
</head>
<body>
<main>
<!-- ───────── 영상 스크립트 ───────── -->
<section id="view-video">
 <!-- 영상: 스크롤해도 항상 상단에 고정 (재생 컨트롤은 하단 고정 바) -->
 <div class="player-bar" id="player-bar">
  <div class="vid-wrap"><div id="yt-player"></div></div>
 </div>
  <div class="card">
    <div id="video-empty" class="muted hidden">영상 스크립트가 아직 없어요.</div>
    <div id="video-main">
      <h2 id="video-title" style="margin-top:0">🎬 영상 스크립트</h2>
      <select id="video-select" class="hidden" onchange="pickVideo(+this.value)" style="width:100%;margin-bottom:12px;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px"></select>
      <p class="muted" id="video-hint" style="margin:10px 0 0">문장을 누르면 <b>그 지점부터 재생</b>, <b>🔁</b>는 <b>그 문장만 반복</b>(다시 누르면 멈춤), <b>「한」</b>은 <b>한글 뜻·핵심 표현</b>, <b>☆</b>는 <b>내 문장 표시</b>예요.</p>
      <input type="text" id="video-search" placeholder="🔎 영어 문장 검색..." oninput="filterScript()" style="margin-top:12px">
      <label class="star-filter"><input type="checkbox" id="star-only" onchange="filterScript()"> ⭐ 내 문장만 보기</label>
      <div class="muted" id="video-count" style="margin-top:8px"></div>
      <div class="script-list" id="script-list"></div>
    </div>
  </div>
</section>

</main>
<!-- 재생 컨트롤: 하단 고정 -->
<nav class="ctrl-bar" id="ctrl-bar">
  <div class="grp">
    <button class="ko-toggle nav-btn" title="이전 문장" onclick="stepLine(-1)">⏮</button>
    <button class="ko-toggle" id="play-btn" title="재생/정지" onclick="togglePlay()">▶</button>
    <button class="ko-toggle nav-btn" title="다음 문장" onclick="stepLine(1)">⏭</button>
  </div>
  <div class="grp">
    <button class="ko-toggle rate-btn on" data-rate="1" onclick="setRate(1)">1x</button>
    <button class="ko-toggle rate-btn" data-rate="0.7" onclick="setRate(0.7)">0.7x</button>
  </div>
  <label class="ko-toggle" title="재생 중인 문장으로 목록 자동 스크롤"><input type="checkbox" id="video-follow" checked> 따라가기</label>
</nav>
<div class="toast" id="toast"></div>

<script>
// 로컬(PC 서버) vs 온라인(Netlify 등 정적 호스팅) 모드 자동 감지
const LOCAL = ['localhost', '127.0.0.1'].includes(location.hostname);
const LS_KEYS = { 'data/video_picks.json': 'engstudy.picks' };
let DB = {};

const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const $ = id => document.getElementById(id);
const toast = msg => { const t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); };

async function load() {
  DB.videoScripts = await fetch('/data/video_scripts.json').then(r => r.json()).catch(() => ({ videos: [] }));
  DB.picks = (!LOCAL && lsGet(LS_KEYS['data/video_picks.json'])) || await fetch('/data/video_picks.json').then(r => r.json()).catch(() => ({ picks: [] }));
  // 첫 동기화 1회: 이 기기에 있던 담은 문장을 공유 목록에 합침
  if (!localStorage.getItem(PICKS_MIGRATED)) syncPicks(DB.picks.picks.map(p => ({ v: p.v, i: p.i, on: true }))).then(ok => ok && localStorage.setItem(PICKS_MIGRATED, '1'));
  else syncPicks();
  ensureVideo();
}

async function save(file, content) {
  if (!LOCAL) { localStorage.setItem(LS_KEYS[file], JSON.stringify(content)); return; }
  const r = await fetch('/api/save', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ file, content }) });
  if (!r.ok) { toast('저장 실패! 서버 확인 필요'); throw new Error('save failed'); }
}

/* ───── 영상 스크립트 ───── */
let ytPlayer = null, ytReady = false, videoData = null, videoLines = [], videoActiveIdx = -1, videoPoll = null, videoBuilt = false;
let lineLoop = null; // 🔁 반복 구간 {i, start, end} — 지금 영상의 그 문장만 반복 재생
const fmtTs = sec => Math.floor(sec / 60) + ':' + String(Math.floor(sec % 60)).padStart(2, '0');

function ensureVideo() {
  if (videoBuilt) return;
  const vids = (DB.videoScripts && DB.videoScripts.videos) || [];
  if (!vids.length) { $('video-main').classList.add('hidden'); $('video-empty').classList.remove('hidden'); videoBuilt = true; return; }
  const sel = $('video-select');
  sel.innerHTML = vids.map((v, i) => `<option value="${i}"></option>`).join('');
  starCounts();
  sel.classList.toggle('hidden', vids.length < 2);
  pickVideo(0);
  loadYT();
  videoBuilt = true;
}

function pickVideo(i) {
  videoData = DB.videoScripts.videos[i];
  lineLoop = null;
  $('video-title').textContent = '🎬 ' + (videoData.title || '영상 스크립트');
  videoLines = videoData.lines || [];
  videoActiveIdx = -1;
  $('video-search').value = '';
  renderScript('');
  $('script-list').scrollTop = 0;
  if (!ytReady) return;
  ytPlayer.cueVideoById(videoData.videoId);
}

function renderScript(q) {
  q = (q || '').trim().toLowerCase();
  const list = $('script-list');
  let shown = 0;
  const vid = videoData.videoId;
  const picked = new Set(DB.picks.picks.filter(p => p.v === vid).map(p => p.i));
  const starOnly = $('star-only').checked;
  list.innerHTML = videoLines.map((L, i) => {
    const on = picked.has(i);
    if ((q && !L.en.toLowerCase().includes(q)) || (starOnly && !on)) return '';
    shown++;
    return `<div class="sl-item${L.turn ? ' turn' : ''}">`
      + `<div class="script-line${i === videoActiveIdx ? ' active' : ''}" data-idx="${i}" onclick="seekTo(${i})">`
      + `<div class="sl-meta"><span class="ts">${fmtTs(L.t)}</span>`
      + `<button class="ko-toggle loop-btn${lineLoop && lineLoop.i === i ? ' on' : ''}" title="이 문장만 반복 (다시 누르면 멈춤)" onclick="event.stopPropagation();toggleLoop(${i})">🔁</button>`
      + `<button class="ko-toggle pick-btn${on ? ' on' : ''}" title="내 문장에 담기" onclick="event.stopPropagation();togglePick('${vid}',${i})">${on ? '★' : '☆'}</button>`
      + `<button class="ko-toggle" title="한글 뜻·표현 보기" onclick="event.stopPropagation();toggleKo(videoLines[${i}],this)">한</button></div>`
      + `<div class="tx">${escapeHtml(L.en)}</div>`
      + `</div><div class="ko-panel hidden"></div></div>`;
  }).join('');
  $('video-count').textContent = (q || starOnly) ? `${starOnly ? '⭐ ' : ''}${q ? `“${q}” ` : ''}${shown}문장 / 전체 ${videoLines.length}문장` : `전체 ${videoLines.length}문장`;
}
function escapeHtml(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function filterScript() { renderScript($('video-search').value); }
// 영상 선택 목록에 영상별 ⭐ 개수 — 내 문장이 어느 영상에 있는지 바로 보이게
function starCounts() {
  DB.videoScripts.videos.forEach((v, i) => {
    const n = DB.picks.picks.filter(p => p.v === v.videoId).length;
    $('video-select').options[i].textContent = `${v.title || v.videoId} (${v.lines.length}문장${n ? ` · ⭐${n}` : ''})`;
  });
}

function toggleKo(L, btn) {
  const panel = btn.closest('.sl-item').querySelector('.ko-panel');
  const willShow = panel.classList.contains('hidden');
  if (willShow && !panel.dataset.filled) {
    if (!L.ko) {
      panel.innerHTML = '<span class="muted">아직 한글 뜻이 준비되지 않았어요. (생성 중 — 잠시 후 새로고침)</span>';
    } else {
      let h = `<div class="ko-tr">🇰🇷 ${escapeHtml(L.ko)}</div>`;
      if (L.note) h += `<div class="ko-note">📝 ${escapeHtml(L.note)}</div>`;
      if (L.terms && L.terms.length) {
        h += '<div class="ko-terms">' + L.terms.map(t => `<div><b>${escapeHtml(t.term)}</b> — ${escapeHtml(t.ko)}</div>`).join('') + '</div>';
      }
      panel.innerHTML = h;
      panel.dataset.filled = '1';   // 뜻이 있을 때만 캐시 (생성 전이면 다음에 다시 시도)
    }
  }
  panel.classList.toggle('hidden');
  btn.classList.toggle('on', !panel.classList.contains('hidden'));
}

function seekTo(i) {
  if (lineLoop) { lineLoop = null; markLoop(); }
  const t = videoLines[i].t;
  if (ytReady && ytPlayer && ytPlayer.seekTo) { ytPlayer.seekTo(t, true); ytPlayer.playVideo(); setActive(i); } // 바로 표시 — ⏭ 연타해도 다음 줄로
  else { window.open(`https://www.youtube.com/watch?v=${videoData.videoId}&t=${Math.floor(t)}s`, '_blank'); }
}
// 이전/다음 문장 — 같은 시각 줄은 한 문장으로 보고 건너뜀
function nextLine(i) { for (let j = i + 1; j < videoLines.length; j++) if (videoLines[j].t > videoLines[i].t) return j; return -1; }
function prevLine(i) { for (let j = i - 1; j >= 0; j--) if (videoLines[j].t < videoLines[i].t) return j; return 0; }
function stepLine(d) {
  const i = videoActiveIdx < 0 ? 0 : d > 0 ? nextLine(videoActiveIdx) : prevLine(videoActiveIdx);
  if (i >= 0) seekTo(i);
}

/* ───── ⭐ 내 문장 (스크립트 줄의 ☆로 표시, '⭐ 내 문장만 보기'로 모아 봄) ─────
   picks: [{v: videoId, i: 줄 번호}] — 타임스탬프는 영상 안에서 중복될 수 있어 줄 번호로 식별.
   ponytail: 줄 번호 기준이라 이미 담은 영상의 스크립트를 다시 만들면(재분할) 엉뚱한 줄을 가리킴 — 그땐 en으로 재매핑 필요 */
/* PC·폰 공유: Netlify 함수(netlify/functions/picks.mjs)가 원본 목록, 각 기기 파일/localStorage는 오프라인용 사본.
   담기/빼기는 연산({v,i,on})으로 보내 양쪽 변경이 누적됨. 못 보낸 연산은 PICKS_PENDING에 쌓았다가 다음 동기화 때 재전송 */
const PICKS_API = (LOCAL ? 'https://tubular-pavlova-e88756.netlify.app' : '') + '/api/picks';
const PICKS_PENDING = 'engstudy.picks.pending', PICKS_MIGRATED = 'engstudy.picks.migrated';
async function syncPicks(ops = []) {
  const pending = [...(lsGet(PICKS_PENDING) || []), ...ops];
  try {
    const r = await fetch(PICKS_API, pending.length ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ops: pending }) } : { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const { picks } = await r.json();
    localStorage.removeItem(PICKS_PENDING);
    if (JSON.stringify(picks) !== JSON.stringify(DB.picks.picks)) {
      DB.picks = { picks };
      save('data/video_picks.json', DB.picks);
      if (videoBuilt && videoData) { filterScript(); starCounts(); }
    }
    return true;
  } catch (e) {
    localStorage.setItem(PICKS_PENDING, JSON.stringify(pending));
    return false;
  }
}
// 다른 기기에서 바꾼 걸 앱으로 돌아올 때 반영
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && DB.picks) syncPicks(); });
function togglePick(v, i) {
  const P = DB.picks;
  const at = P.picks.findIndex(p => p.v === v && p.i === i);
  if (at >= 0) P.picks.splice(at, 1); else P.picks.push({ v, i });
  save('data/video_picks.json', P);
  syncPicks([{ v, i, on: at < 0 }]);
  starCounts();
  const b = v === videoData.videoId && $('script-list').querySelector(`[data-idx="${i}"] .pick-btn`);
  if (b) { b.classList.toggle('on', at < 0); b.textContent = at < 0 ? '★' : '☆'; }
}
// 🔁 = 그 문장만 반복(다음 문장 시작 시각까지), 같은 문장 다시 누르면 반복 끄고 일시정지
function toggleLoop(i) {
  if (lineLoop && lineLoop.i === i) { lineLoop = null; markLoop(); if (ytReady) ytPlayer.pauseVideo(); return; }
  seekTo(i);
  if (!ytReady) return;
  const n = nextLine(i);
  lineLoop = { i, start: videoLines[i].t, end: videoLines[i].e || (n >= 0 ? videoLines[n].t : Infinity) }; // e = 문장 끝 (다음 줄 t는 이 문장이 끝나기 전일 수 있음)
  markLoop();
}
function markLoop() {
  $('script-list').querySelectorAll('.loop-btn.on').forEach(b => b.classList.remove('on'));
  const b = lineLoop && $('script-list').querySelector(`[data-idx="${lineLoop.i}"] .loop-btn`);
  if (b) b.classList.add('on');
}

function loadYT() {
  if (window.YT && window.YT.Player) { createPlayer(); return; }
  if (!document.getElementById('yt-api-script')) {
    const tag = document.createElement('script');
    tag.id = 'yt-api-script'; tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
  }
  window.onYouTubeIframeAPIReady = createPlayer;
}
function createPlayer() {
  if (ytPlayer) return;
  ytPlayer = new YT.Player('yt-player', {
    videoId: videoData.videoId,
    playerVars: { playsinline: 1, rel: 0, modestbranding: 1 },
    events: { onReady: () => { ytReady = true; if (ytPlayer.getVideoData().video_id !== videoData.videoId) ytPlayer.cueVideoById(videoData.videoId); }, onStateChange: onYtState },
  });
}
// 재생 속도 — 영상을 바꾸면(loadVideoById) 1x로 돌아가므로 재생 시작 때마다 다시 맞춤
let playRate = 1;
function setRate(r) {
  playRate = r;
  document.querySelectorAll('.rate-btn').forEach(b => b.classList.toggle('on', +b.dataset.rate === r));
  if (ytReady) ytPlayer.setPlaybackRate(r);
}
function togglePlay() {
  if (!ytReady) return;
  if (ytPlayer.getPlayerState() === YT.PlayerState.PLAYING) ytPlayer.pauseVideo(); else ytPlayer.playVideo();
}
function onYtState(e) {
  $('play-btn').textContent = e.data === YT.PlayerState.PLAYING ? '⏸' : '▶'; // 영상 직접 조작해도 맞춰짐
  if (e.data === YT.PlayerState.PLAYING && ytPlayer.getPlaybackRate() !== playRate) ytPlayer.setPlaybackRate(playRate);
  if (e.data === YT.PlayerState.PLAYING) startVideoPoll(); else stopVideoPoll();
  if (e.data === YT.PlayerState.ENDED && lineLoop) { ytPlayer.seekTo(lineLoop.start, true); ytPlayer.playVideo(); } // 마지막 문장 반복
}
function startVideoPoll() { if (!videoPoll) videoPoll = setInterval(updateActiveLine, 200); }
function stopVideoPoll() { if (videoPoll) { clearInterval(videoPoll); videoPoll = null; } }
function updateActiveLine() {
  if (!ytReady || !ytPlayer.getCurrentTime) return;
  const t = ytPlayer.getCurrentTime();
  if (lineLoop && t >= lineLoop.end) { ytPlayer.seekTo(lineLoop.start, true); return; } // 🔁 문장 반복
  let lo = 0, hi = videoLines.length - 1, idx = 0;
  while (lo <= hi) { const mid = (lo + hi) >> 1; if (videoLines[mid].t <= t) { idx = mid; lo = mid + 1; } else hi = mid - 1; }
  setActive(idx);
}
function setActive(idx) {
  if (idx === videoActiveIdx) return;
  const prev = $('script-list').querySelector('.script-line.active');
  if (prev) prev.classList.remove('active');
  videoActiveIdx = idx;
  const el = $('script-list').querySelector(`[data-idx="${idx}"]`);
  if (el) {
    el.classList.add('active');
    if ($('video-follow').checked) {
      const box = $('script-list');
      box.scrollTop = el.offsetTop;
    }
  }
}

// 상단 영상 바·하단 컨트롤 바 높이 → CSS --bar-h / --nav-h (스크립트·내 문장 목록이 두 바 사이 화면에 딱 맞게)
const trackH = (el, v) => new ResizeObserver(() => document.documentElement.style.setProperty(v, el.offsetHeight + 'px')).observe(el);
trackH($('player-bar'), '--bar-h');
trackH($('ctrl-bar'), '--nav-h');
load();
</script>
</body>
